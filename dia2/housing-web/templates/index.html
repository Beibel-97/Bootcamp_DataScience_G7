<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Predicción de precio de casas</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: #f5f7fb;
      color: #1f2937;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
    }

    .card {
      width: min(100%, 520px);
      background: #ffffff;
      border-radius: 28px;
      padding: 32px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
      border: 1px solid rgba(148, 163, 184, 0.16);
    }

    .title {
      margin: 0 0 24px;
      font-size: clamp(1.75rem, 2.2vw, 2.4rem);
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: #111827;
    }

    .description {
      margin: 0 0 28px;
      color: #475569;
      font-size: 1rem;
      line-height: 1.75;
    }

    .form-group {
      display: grid;
      gap: 14px;
      margin-bottom: 28px;
    }

    label {
      font-weight: 600;
      color: #0f172a;
    }

    select,
    button {
      width: 100%;
      border-radius: 14px;
      border: 1px solid #cbd5e1;
      padding: 14px 16px;
      font-size: 1rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    select {
      appearance: none;
      background: #fff;
      color: #0f172a;
    }

    select:focus,
    button:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
    }

    button {
      background: #4f46e5;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    button:hover {
      background: #4338ca;
    }

    .result {
      display: grid;
      gap: 12px;
      padding: 22px;
      border-radius: 20px;
      background: linear-gradient(135deg, #eef2ff 0%, #eefbf7 100%);
      border: 1px solid rgba(99, 102, 241, 0.18);
    }

    .result-label {
      color: #334155;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .result-value {
      display: flex;
      align-items: baseline;
      gap: 10px;
      font-size: clamp(1.75rem, 2.4vw, 2.6rem);
      font-weight: 800;
      color: #1d4ed8;
    }

    .result-value span {
      font-size: 1.1rem;
      color: #475569;
      font-weight: 500;
    }

    @media (max-width: 420px) {
      .card {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1 class="title">Predicción de precio de casas con Machine Learning</h1>
    <p class="description">Selecciona el número de habitaciones y calcula el precio estimado de una casa</p>

    <form class="form-group" action="/" method="POST">
      <label for="rooms">Número de habitaciones</label>
      <select id="rooms" name="rooms">
        {% for room in range(1,6) %}
          <option value="{{ room }}" {% if rooms == room %}selected{% endif %}>
            {{ room }}
          </option>
        {% endfor %}
      </select>
      <button type="submit">Calcular precio</button>
    </form>

    {% if precio > 0 %}
      <div class="result">
        <p class="result-label">Precio estimado</p>
        <p class="result-value"><span>$</span>{{precio}} dólares</p>
      </div>
    {% endif %}
  </main>
</body>
</html>
